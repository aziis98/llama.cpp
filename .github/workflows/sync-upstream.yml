name: sync-upstream

on:
  schedule:
    # every day at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch upstream master
        run: |
          git remote add upstream https://github.com/ggml-org/llama.cpp
          git fetch --no-tags upstream master

      - name: Rebase fork commits onto upstream
        run: |
          if git rebase upstream/master; then
            echo "rebase ok"
          else
            echo "::error::rebase conflicts - resolve manually and push"
            git rebase --abort
            exit 1
          fi

      - name: Force-push rebased master
        run: git push --force-with-lease origin master
